
services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:5000"
    restart: unless-stopped

  product-service:
    build: ./product-servic
    container_name: product-servic
    ports:
      - "8082:5000"
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:5000"
    restart: unless-stopped
